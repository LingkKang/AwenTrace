name: Pages
run-name: Deploy tested commit ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested demo
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the triggering Tests run's site
        uses: actions/download-artifact@v8
        with:
          name: tested-demo-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/tested-demo
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/tested-demo

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
